name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    name: Windows App + NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows installer and app
        working-directory: frontend
        run: npm run tauri:build:nsis

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp26-windows-app
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/app.exe
            frontend/src-tauri/target/release/vp26-backend.exe

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp26-windows-installer
          if-no-files-found: error
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Linux App + DEB
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            python3-venv

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Linux deb and app
        working-directory: frontend
        run: npm run tauri:build:deb

      - name: Upload Linux app artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp26-linux-app
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/app
            frontend/src-tauri/target/release/vp26-backend

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp26-linux-deb
          if-no-files-found: error
          path: frontend/src-tauri/target/release/bundle/deb/*.deb

  build-android:
    name: Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Initialise Android project
        working-directory: frontend
        run: npx tauri android init --ci

      # Auf Android gibt es keinen mitgelieferten Python-Dienst, deshalb muss die
      # App auf ein erreichbares Backend zeigen.
      # Release statt Debug und nur arm64: die universelle Debug-Variante wog
      # 691 MB, was zum Aufspielen aufs Handy unbrauchbar ist.
      - name: Build release APK (arm64)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VP26_WEB_API_BASE_URL }}
        run: npx tauri android build --apk --target aarch64

      # Eine unsignierte APK laesst sich nicht installieren. Liegt ein eigener
      # Schluessel als Secret bereit, wird er genommen - sonst ein Wegwerfschluessel
      # nur fuer Testinstallationen.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.VP26_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.VP26_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VP26_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/vp26.keystore"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_pass="$KEYSTORE_PASSWORD"
            alias_name="$KEY_ALIAS"
            echo "Signiere mit hinterlegtem Schluessel."
          else
            store_pass="android"
            alias_name="vp26-test"
            keytool -genkeypair -v -keystore "$keystore" -storepass "$store_pass"               -keypass "$store_pass" -alias "$alias_name" -keyalg RSA -keysize 2048               -validity 10000 -dname "CN=VP26 Test, O=NSRS, C=DE"
            echo "::warning::Kein VP26_ANDROID_KEYSTORE hinterlegt - die APK ist mit einem Wegwerfschluessel signiert. Updates lassen sich nicht darueber installieren."
          fi

          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p apk-out

          find frontend/src-tauri/gen/android -name '*.apk' | while read -r apk; do
            target="apk-out/vp26-$(basename "$apk" | sed 's/-unsigned//')"
            cp "$apk" "$target"
            "$build_tools/apksigner" sign --ks "$keystore" --ks-pass "pass:$store_pass"               --key-pass "pass:$store_pass" --ks-key-alias "$alias_name" "$target"
            "$build_tools/apksigner" verify --print-certs "$target" | head -3
          done

          ls -lh apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp26-android-apk
          if-no-files-found: error
          path: apk-out/*.apk

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux
      - build-android
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
