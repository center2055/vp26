name: Keep Backend Awake

# Kostenlose Render-Instanzen schlafen nach 15 Minuten ohne Anfrage ein und
# brauchen dann rund eine Minute zum Aufwachen. Ein regelmaessiger Ping haelt
# sie wach, damit der erste Aufruf am Morgen nicht ins Leere laeuft.
#
# Nicht rund um die Uhr: der kostenlose Plan deckt 750 Instanzstunden im Monat,
# ein voller Monat hat rund 730 - dauerhaft wach waere das Kontingent auf Kante
# genaeht. Dieses Fenster kostet gut 570 Stunden.
#
# Cron laeuft in UTC. 4-22 UTC sind in deutscher Sommerzeit 06:00 bis 00:59,
# deckt also den Blick vor der Schule genauso ab wie den am Abend davor.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 4-22 * * *'

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Call health endpoint
        env:
          API_BASE: ${{ vars.VP26_WEB_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::warning::VP26_WEB_API_BASE_URL ist nicht gesetzt - nichts zu pingen."
            exit 0
          fi

          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$API_BASE/api/health" || echo 000)"
          echo "$API_BASE/api/health -> $status"

          if [ "$status" != "200" ]; then
            echo "::warning::Backend antwortete mit $status"
          fi
